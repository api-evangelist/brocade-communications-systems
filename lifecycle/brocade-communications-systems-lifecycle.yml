method: searched
source: >-
  FOS-92x-REST-API-RM104 sections "FOS REST API Version History", "Deprecated and Obsolete
  Resources in Fabric OS 9.2.1" and "Revision History",
  https://techdocs.broadcom.com/content/dam/broadcom/techdocs/us/en/pdf/fc-networking/software-restapi/fos-92x-restapi.pdf
docs: >-
  https://techdocs.broadcom.com/us/en/fibre-channel-networking/fabric-os/fabric-os-rest-api/9-2-x.html
provider: Brocade Communications Systems
providerId: brocade-communications-systems
description: >-
  Versioning, deprecation and support lifecycle for the Brocade Fabric OS REST API. The API ships
  inside switch firmware, so its lifecycle is the firmware's: versions are Fabric OS releases,
  deprecations are announced in the reference manual, and there is no hosted service to have a
  status page for.
versioning:
  scheme: semver, at two levels
  resource_api:
    current: 2.0.0
    for_release: Fabric OS 9.2.1
    discoverable_at_runtime: true
    mechanism: >-
      The resource API version is returned in the Content-Type response header, e.g.
      "Content-Type: application/yang-data+xml;version=2.0.0".
    rules:
      major: A backward-incompatible API change, such as removing a deprecated top-level container.
      minor: A backward-compatible change, such as adding a top-level container name or leaf.
      patch: A backward-compatible change, such as a new pattern for a leaf.
  module_level:
    mechanism: >-
      Every YANG module carries its own revision number, retrievable from the
      brocade-module-version module (GET /rest/brocade-module-version).
    examples:
    - module: brocade-chassis
      version: 2.0.0
    - module: brocade-fibrechannel-switch
      version: 4.0.0
    - module: brocade-interface
      version: 4.0.0
    - module: brocade-zone
      version: 2.0.0
    - module: brocade-maps
      version: 4.0.0
  in_url: false
  note: >-
    The base path carries no version segment. A client determines what it is talking to from the
    Content-Type version parameter and the brocade-module-version module, not from the URL.
deprecation_policy:
  published: true
  mechanism: >-
    Deprecated and obsolete resources are enumerated per release in the reference manual, each
    naming its replacement. Deprecated leaves also carry a "Deprecated:" note inline in the module
    definition tables. Removal of a deprecated top-level container is explicitly defined as the
    trigger for a major resource-API version bump.
  headers:
    sunset: false
    deprecation: false
    note: >-
      No RFC 8594 Sunset or Deprecation response headers. Deprecation is a documentation signal,
      not a runtime one.
  removal_window: not stated
