deprecated_note: >-
  Individual leaves are deprecated far more often than whole resources — brocade-extension's
  l4-protocol (use l4-protocol-v2), admin-status/admin-status-v2, tunnel-status/tunnel-status-v2,
  ficon/ficon-v2 and dozens more carry inline "deprecated" notes in the 9.2.x manual. The list
  above is the manual's own resource-level roll-up, not the full leaf-level set.
releases:
  supported_firmware:
  - Fabric OS 8.2.0 and later (Gen 6)
  - Fabric OS 9.0.0 and later (Gen 7)
  current_reference_manual: '10.0.x'
  current_reference_manual_url: https://techdocs.broadcom.com/fabric-os-rest-api
status_page:
  exists: false
  reason: >-
    Both APIs run on customer-owned equipment — a switch and a customer-installed SANnav server.
    There is no Brocade-operated endpoint whose uptime could be reported, so no status page
    exists and none should. Recorded as a genuine N/A rather than a gap.
sla:
  published: false
  note: >-
    Availability is a property of the customer's own fabric. Broadcom support entitlements are
    contractual and are not published as an API SLA.
security_advisories:
  published: true
  url: https://support.broadcom.com/web/ecx/security-advisory?segment=BSN
  note: Brocade security advisories are published on the Broadcom support portal under segment BSN.
