description: >-
  Brocade Communications Systems was a provider of data networking and storage networking
  products and services, including SAN switches, IP networking equipment, routers, and
  network management software for enterprises and service providers. Brocade was acquired
  by Broadcom in 2017. The IP networking business was sold to Extreme Networks, while
  the Fibre Channel SAN portfolio was retained by Broadcom under the Brocade brand.
