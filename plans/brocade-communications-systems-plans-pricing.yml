description: >-
  Plans and pricing for the Brocade API surface. There are none to record. This file replaces a
  2026-05-04 scaffold that invented Free / Professional / Enterprise tiers with per-request quotas
  — a shape that does not exist for this product and was crediting Brocade with a pricing page it
  has never published.
