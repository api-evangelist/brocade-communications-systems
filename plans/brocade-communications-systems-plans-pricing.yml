note: >-
  The Fabric OS REST API is not a metered service and is not sold. It is enabled by default in
  Fabric OS firmware on a switch the customer already owns: "This API is referred to as the FOS
  REST API and is enabled by default in Fabric OS." There is no signup, no API key issuance, no
  free tier and no per-call charge. Access is a switch account plus a Fabric OS RBAC role.
  The SANnav Management Portal REST API is the same story one level up — it ships inside SANnav
  Management Portal, which is licensed software (Base and Enterprise editions) sold through
  Broadcom and its channel partners. Broadcom publishes no list price for it; the How To Buy page
  routes to sales and partners rather than to a price. Nothing on broadcom.com states a figure we
  could record, so nothing is recorded.
